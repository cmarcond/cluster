# Credentials for CTFd and its database. The values below are placeholders:
# replace every CHANGE_ME before applying, and do not commit real values.
# The password inside DATABASE_URL must be the same as MYSQL_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: ctfd-secrets
  namespace: ctfd
  labels:
    app: ctfd
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: CHANGE_ME
  MYSQL_PASSWORD: CHANGE_ME
  DATABASE_URL: mysql+pymysql://ctfd:CHANGE_ME@ctfd-mariadb.ctfd.svc.cluster.local:3306/ctfd
